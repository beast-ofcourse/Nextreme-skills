<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow-sync" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrow-async" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-stream" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#059669"/>
    </marker>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="llm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="tool-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="memory-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="user-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">AI Agent Workflow: ReAct Loop</text>

  <!-- ============================================ -->
  <!-- USER ACTOR (Circle, top-left) -->
  <!-- ============================================ -->
  <circle cx="120" cy="220" r="45" fill="url(#user-grad)" stroke="#4338ca" stroke-width="2.5"/>
  <text x="120" y="215" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">User</text>
  <text x="120" y="232" font-family="Inter, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Actor</text>

  <!-- ============================================ -->
  <!-- LLM / REASONING ENGINE (Double-border rect, center) -->
  <!-- ============================================ -->
  <!-- Outer border -->
  <rect x="310" y="140" width="260" height="160" rx="16" fill="none" stroke="#5b21b6" stroke-width="3"/>
  <!-- Inner fill -->
  <rect x="316" y="146" width="248" height="148" rx="14" fill="url(#llm-grad)"/>
  <text x="440" y="205" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">LLM</text>
  <text x="440" y="225" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Reasoning Engine</text>
  <text x="440" y="245" font-family="Inter, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Claude 3.5 Sonnet</text>
  <rect x="370" y="258" width="140" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
  <text x="440" y="273" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">role: reasoning_engine</text>

  <!-- ============================================ -->
  <!-- TOOLS (Rounded rect, right) -->
  <!-- ============================================ -->
  <rect x="670" y="145" width="180" height="150" rx="14" fill="url(#tool-grad)" stroke="#065f46" stroke-width="2.5"/>
  <text x="760" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Tools</text>
  <text x="760" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">External Functions</text>
  <rect x="700" y="235" width="120" height="20" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="760" y="249" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Search Tool</text>
  <rect x="700" y="259" width="120" height="20" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="760" y="273" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Calculator</text>

  <!-- ============================================ -->
  <!-- MEMORY (Cylinder shape, left-center) -->
  <!-- ============================================ -->
  <!-- Cylinder top ellipse -->
  <ellipse cx="200" cy="388" rx="60" ry="18" fill="url(#memory-grad)" stroke="#92400e" stroke-width="2.5"/>
  <!-- Cylinder body -->
  <rect x="140" y="388" width="120" height="100" fill="url(#memory-grad)" stroke="#92400e" stroke-width="2.5"/>
  <!-- Cylinder bottom ellipse (to cover border) -->
  <ellipse cx="200" cy="488" rx="60" ry="18" fill="url(#memory-grad)" stroke="#92400e" stroke-width="2.5"/>
  <text x="200" y="435" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Memory</text>
  <text x="200" y="455" font-family="Inter, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Vector Store</text>
  <text x="200" y="475" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Chroma DB</text>

  <!-- ============================================ -->
  <!-- EDGES -->
  <!-- ============================================ -->

  <!-- User -> LLM: Sync Request (Solid) -->
  <line x1="165" y1="220" x2="308" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <rect x="200" y="195" width="90" height="18" rx="4" fill="rgba(255,255,255,0.9)" stroke="#e5e7eb" stroke-width="1"/>
  <text x="245" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Query / Request</text>

  <!-- LLM -> Tools: Async Event (Dashed) -->
  <line x1="572" y1="200" x2="668" y2="200" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-async)"/>
  <rect x="585" y="175" width="75" height="18" rx="4" fill="rgba(255,255,255,0.9)" stroke="#e5e7eb" stroke-width="1"/>
  <text x="622" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Invoke Tool</text>

  <!-- Tools -> LLM: Sync Response (Solid reverse) -->
  <line x1="668" y1="270" x2="572" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <rect x="585" y="245" width="75" height="18" rx="4" fill="rgba(255,255,255,0.9)" stroke="#e5e7eb" stroke-width="1"/>
  <text x="622" y="258" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Observation</text>

  <!-- LLM -> Memory: Async Event (Dashed) -->
  <line x1="390" y1="302" x2="260" y2="388" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-async)"/>
  <rect x="290" y="330" width="85" height="18" rx="4" fill="rgba(255,255,255,0.9)" stroke="#e5e7eb" stroke-width="1"/>
  <text x="332" y="343" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Store Context</text>

  <!-- Memory -> LLM: Sync Response (Solid) -->
  <line x1="260" y1="420" x2="390" y2="310" stroke="#374151" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <rect x="290" y="370" width="85" height="18" rx="4" fill="rgba(255,255,255,0.9)" stroke="#e5e7eb" stroke-width="1"/>
  <text x="332" y="383" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Retrieve</text>

  <!-- ============================================ -->
  <!-- LEGEND -->
  <!-- ============================================ -->
  <rect x="40" y="545" width="820" height="85" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>

  <text x="60" y="570" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Arrow Semantics:</text>

  <!-- Sync -->
  <line x1="60" y1="590" x2="120" y2="590" stroke="#374151" stroke-width="2"/>
  <polygon points="120,590 110,586 110,594" fill="#374151"/>
  <text x="130" y="594" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Sync Request (Solid)</text>

  <!-- Async -->
  <line x1="260" y1="590" x2="320" y2="590" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,5"/>
  <polygon points="320,590 310,586 310,594" fill="#6b7280"/>
  <text x="330" y="594" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Async Event (Dashed)</text>

  <!-- Double border indicator -->
  <rect x="485" y="578" width="18" height="18" rx="3" fill="none" stroke="#5b21b6" stroke-width="2"/>
  <rect x="488" y="581" width="12" height="12" rx="2" fill="none" stroke="#5b21b6" stroke-width="2"/>
  <text x="510" y="594" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Double Border = LLM / AI</text>

  <!-- Cylinder indicator -->
  <ellipse cx="670" cy="582" rx="8" ry="4" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <rect x="662" y="582" width="16" height="12" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="670" cy="594" rx="8" ry="4" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <text x="688" y="594" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Cylinder = Storage / DB</text>

  <!-- Semantic metadata (hidden, for programmatic use) -->
  <metadata>
    <graph-role>agent-loop</graph-role>
    <semantic-role>ai_agent_workflow</semantic-role>
    <style>agentic-workflow</style>
    <generated-by>ultimate-diagrams</generated-by>
    <nodes>user,llm,tools,memory</nodes>
    <edges>user:llm:sync_request, llm:tools:async_event, tools:llm:sync_response, llm:memory:async_event, memory:llm:sync_response</edges>
  </metadata>
</svg>
