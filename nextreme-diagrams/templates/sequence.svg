<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-req" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-res" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">Sequence Diagram: User Login Flow</text>

  <!-- ============================================ -->
  <!-- LIFELINES -->
  <!-- ============================================ -->

  <!-- Client -->
  <line x1="120" y1="160" x2="120" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="60" y="115" width="120" height="40" rx="20" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Client</text>
  <text x="120" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">lifeline</text>

  <!-- API Gateway -->
  <line x1="320" y1="160" x2="320" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="250" y="115" width="140" height="40" rx="20" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">API Gateway</text>
  <text x="320" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">lifeline</text>

  <!-- Auth Service -->
  <line x1="530" y1="160" x2="530" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="460" y="115" width="140" height="40" rx="20" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="530" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Auth Service</text>
  <text x="530" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">lifeline</text>

  <!-- User DB -->
  <line x1="750" y1="160" x2="750" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="690" y="115" width="120" height="40" rx="20" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="750" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">User DB</text>
  <text x="750" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">lifeline</text>

  <!-- ============================================ -->
  <!-- MESSAGES -->
  <!-- ============================================ -->

  <!-- 1. Client -> API: POST /login -->
  <line x1="185" y1="200" x2="310" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)"/>
  <rect x="190" y="180" width="115" height="18" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="248" y="193" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">POST /login</text>
  <text x="125" y="205" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">1</text>

  <!-- Activation bar: API Gateway -->
  <rect x="315" y="195" width="10" height="30" fill="#93c5fd" rx="2"/>

  <!-- 2. API -> Auth: validate() -->
  <line x1="385" y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)"/>
  <rect x="390" y="220" width="120" height="18" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="233" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">validate()</text>
  <text x="325" y="245" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">2</text>

  <!-- Activation bar: Auth Service -->
  <rect x="525" y="235" width="10" height="50" fill="#6ee7b7" rx="2"/>

  <!-- 3. Auth -> DB: SELECT user -->
  <line x1="595" y1="270" x2="740" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)"/>
  <rect x="600" y="250" width="130" height="18" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="665" y="263" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">SELECT user</text>
  <text x="535" y="275" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">3</text>

  <!-- Activation bar: User DB -->
  <rect x="745" y="265" width="10" height="30" fill="#fcd34d" rx="2"/>

  <!-- 4. DB -> Auth: user data -->
  <line x1="745" y1="300" x2="540" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arrow-res)"/>
  <rect x="605" y="282" width="110" height="18" rx="4" fill="rgba(5,150,105,0.08)" stroke="#a7f3d0" stroke-width="1"/>
  <text x="660" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#059669" text-anchor="middle">user data</text>
  <text x="750" y="305" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">4</text>

  <!-- 5. Auth -> API: JWT token -->
  <line x1="525" y1="330" x2="330" y2="330" stroke="#059669" stroke-width="2" marker-end="url(#arrow-res)"/>
  <rect x="380" y="312" width="110" height="18" rx="4" fill="rgba(5,150,105,0.08)" stroke="#a7f3d0" stroke-width="1"/>
  <text x="435" y="325" font-family="system-ui, sans-serif" font-size="9" fill="#059669" text-anchor="middle">JWT token</text>
  <text x="530" y="335" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">5</text>

  <!-- 6. API -> Client: 200 OK -->
  <line x1="315" y1="360" x2="130" y2="360" stroke="#059669" stroke-width="2" marker-end="url(#arrow-res)"/>
  <rect x="175" y="342" width="115" height="18" rx="4" fill="rgba(5,150,105,0.08)" stroke="#a7f3d0" stroke-width="1"/>
  <text x="233" y="355" font-family="system-ui, sans-serif" font-size="9" fill="#059669" text-anchor="middle">200 OK</text>
  <text x="320" y="365" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">6</text>

  <!-- ============================================ -->
  <!-- ALTERNATIVE / EXCEPTION PATH -->
  <!-- ============================================ -->
  <rect x="60" y="395" width="790" height="80" rx="8" fill="rgba(239,68,68,0.04)" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="415" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#dc2626">alt: Invalid Credentials</text>

  <!-- 7. Auth -> Client: 401 -->
  <line x1="520" y1="440" x2="130" y2="440" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-req)"/>
  <rect x="250" y="422" width="120" height="18" rx="4" fill="rgba(239,68,68,0.08)" stroke="#fca5a5" stroke-width="1"/>
  <text x="310" y="435" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">401 Unauthorized</text>
  <text x="525" y="445" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">7</text>

  <!-- ============================================ -->
  <!-- LEGEND -->
  <!-- ============================================ -->
  <rect x="60" y="500" width="790" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>

  <text x="80" y="520" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Arrow Semantics:</text>

  <!-- Request -->
  <line x1="80" y1="542" x2="130" y2="542" stroke="#475569" stroke-width="2"/>
  <polygon points="130,542 120,538 120,546" fill="#475569"/>
  <text x="140" y="546" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Request / Call</text>

  <!-- Response -->
  <line x1="260" y1="542" x2="310" y2="542" stroke="#059669" stroke-width="2"/>
  <polygon points="310,542 300,538 300,546" fill="#059669"/>
  <text x="320" y="546" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Response / Return</text>

  <!-- Error -->
  <line x1="450" y1="542" x2="500" y2="542" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="500,542 490,538 490,546" fill="#dc2626"/>
  <text x="510" y="546" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Error / Exception</text>

  <!-- Activation bar -->
  <rect x="630" y="535" width="10" height="14" fill="#93c5fd" rx="2"/>
  <text x="650" y="546" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Activation Bar</text>

  <metadata>
    <graph-role>sequence-diagram</graph-role>
    <semantic-role>api_sequence</semantic-role>
    <style>sequence</style>
    <generated-by>nextreme-diagrams</generated-by>
    <lifelines>client,api-gateway,auth-service,user-db</lifelines>
    <messages>6 synch, 1 exception</messages>
  </metadata>
</svg>
