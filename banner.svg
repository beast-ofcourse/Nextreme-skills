<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nextreme-Skills">
  <title>Nextreme-Skills</title>
  <desc>Minimal professional banner for Nextreme-Skills — centered mark and wordmark on calm background.</desc>
  <defs>
    <!-- 6-stop orange accent — not flat -->
    <linearGradient id="nxt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b1f"/>
      <stop offset="22%" stop-color="#ff5a1f"/>
      <stop offset="45%" stop-color="#ff7a1f"/>
      <stop offset="68%" stop-color="#ff9a2e"/>
      <stop offset="85%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ffd06a"/>
    </linearGradient>
    <linearGradient id="nxt-accent-soft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff8a2e" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="nxt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#ff5a1f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <!-- minimal dot grid — 32px snap -->
    <pattern id="nxt-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.9" fill="#e5e7eb"/>
    </pattern>
    <!-- soft colored shadow — never pure black, linearRGB -->
    <filter id="nxt-logo-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1e28" flood-opacity="0.10"/>
    </filter>
    <filter id="nxt-text-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="linearRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0a0a0f" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- layered order: background → containers → nodes → labels → connections -->
  <g id="background">
    <rect x="0" y="0" width="720" height="240" fill="#fcfcfd"/>
    <rect x="0" y="0" width="720" height="240" fill="url(#nxt-dots)" opacity="1"/>
    <!-- soft glow behind center mark — barely there, professional -->
    <ellipse cx="360" cy="96" rx="180" ry="82" fill="url(#nxt-glow)"/>
  </g>

  <g id="containers">
    <!-- hairline frame — whisper, not heavy -->
    <rect x="10.5" y="10.5" width="699" height="219" rx="16" fill="none" stroke="#ececef" stroke-width="1"/>
    <rect x="11" y="11" width="698" height="218" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  </g>

  <g id="nodes">
    <!-- unique minimal mark — 48×48 rounded square, orange accent, white N-arrow (extreme climb) -->
    <g transform="translate(336 62)" filter="url(#nxt-logo-shadow)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#nxt-accent)"/>
      <!-- inner N-arrow — white, geometric, minimal -->
      <path d="M12 36 L12 12 L18.5 12 L29.5 28.2 L29.5 12 L36 12 L36 36 L29.5 36 L18.5 19.8 L18.5 36 Z" fill="#ffffff" opacity="0.98"/>
      <!-- arrow tip cut on N leg — tiny triangle to signal climb -->
      <path d="M30.2 36 L38 36 L33.4 28.6 Z" fill="#ffffff" opacity="0.98"/>
      <!-- subtle inner highlight — top edge -->
      <rect x="0" y="0" width="48" height="1.2" rx="0.6" fill="#ffffff" opacity="0.18"/>
    </g>
  </g>

  <g id="labels">
    <!-- Nextreme-Skills — single lockup, good font, tight tracking -->
    <!-- using system ui-sans stack for GitHub-fidelity; hyphen in accent via tspan -->
    <text x="360" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#0a0a0f" filter="url(#nxt-text-shadow)">Nextreme<tspan fill="#ff5a1f" font-weight="800">-</tspan>Skills</text>
  </g>

  <g id="connections">
    <!-- minimal accent rule — 40px, centered under wordmark, geometric spacing -->
    <rect x="340" y="166" width="40" height="2.5" rx="1.25" fill="url(#nxt-accent-soft)"/>
  </g>
</svg>
