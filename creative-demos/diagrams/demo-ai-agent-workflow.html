<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Powered Research Assistant — Agent Workflow</title>
<style>
@page { size: A4 landscape; margin: 0.4in; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: #eff1f5;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.page { width: 1300px; background: #eff1f5; padding: 20px 0; }
.title { text-align: center; font-size: 28px; font-weight: 800; color: #4c4f69; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 14px; color: #6c6f85; margin-bottom: 16px; }
svg.diagram { width: 100%; height: auto; display: block; }

@media print { body { padding: 0; } .page { width: 100%; padding: 0; } }

@media (prefers-color-scheme: dark) {
  body { background: #1e1e2e; }
  .page { background: #1e1e2e; }
  .title { color: #cdd6f4; }
  .subtitle { color: #a6adc8; }
}
</style>
</head>
<body>
<div class="page">
<div class="title">RAG-Powered Research Assistant — Agent Workflow</div>
<div class="subtitle">ReAct loop — retrieval-augmented generation with tool-use orchestration</div>
<svg class="diagram" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
<style>
  .diagram-bg { fill: var(--page-bg, #eff1f5); }
  .node-bg { fill: var(--node-bg, #e6e9ef); }
  .node-alt { fill: var(--alt-bg, #dce0e8); }
  .node-border { stroke: var(--border, #ccd0da); }
  .text-main { fill: var(--text, #4c4f69); }
  .text-secondary { fill: var(--text-sec, #6c6f85); }
  .text-accent { fill: var(--accent, #1e66f5); }
  .text-inverse { fill: var(--text-inv, #eff1f5); }
  .arrow-line { stroke: var(--accent, #1e66f5); fill: none; }
  .arrow-dashed { stroke: var(--accent, #1e66f5); fill: none; stroke-dasharray: 7,5; }
  .arrow-bold { stroke: var(--accent, #1e66f5); fill: none; }
  .accent-fill { fill: var(--accent, #1e66f5); }
  .highlight { fill: var(--yellow, #df8e1d); }
  .green-fill { fill: var(--green, #40a02b); }
  .green-bg { fill: var(--green-bg, #e4f2e4); }
  .red-fill { fill: var(--red, #d20f39); }
  .mauve-fill { fill: var(--mauve, #8839ef); }
  .teal-fill { fill: var(--teal, #179299); }
  .react-zone { fill: var(--react-bg, #f0eef4); stroke: var(--react-border, #d5d0e0); }
  .legend-bg { fill: var(--node-bg, #e6e9ef); stroke: var(--border, #ccd0da); }
  .legend-text { fill: var(--text, #4c4f69); }
  .label-bg { fill: rgba(230,233,239,0.88); }
  .node-label { font-family: system-ui,sans-serif; font-size: 14px; font-weight: 600; }
  .node-sublabel { font-family: system-ui,sans-serif; font-size: 10.5px; font-weight: 400; }
  .arrow-label { font-family: system-ui,sans-serif; font-size: 10px; font-weight: 500; }
  .section-title { font-family: system-ui,sans-serif; font-size: 12px; font-weight: 700; }
  .legend-label { font-family: system-ui,sans-serif; font-size: 11px; }
  #arrow path, #arrow-dashed path { stroke: var(--accent, #1e66f5); fill: none; }
  #arrow-bold path { fill: var(--accent, #1e66f5); stroke: var(--accent, #1e66f5); }
  @media (prefers-color-scheme: dark) {
    .diagram-bg { fill: #1e1e2e; }
    .node-bg { fill: #313244; }
    .node-alt { fill: #181825; }
    .node-border { stroke: #45475a; }
    .text-main { fill: #cdd6f4; }
    .text-secondary { fill: #a6adc8; }
    .text-accent { fill: #89b4fa; }
    .text-inverse { fill: #1e1e2e; }
    .arrow-line { stroke: #89b4fa; }
    .arrow-dashed { stroke: #89b4fa; }
    .arrow-bold { stroke: #89b4fa; }
    .accent-fill { fill: #89b4fa; }
    .highlight { fill: #f9e2af; }
    .green-fill { fill: #a6e3a1; }
    .green-bg { fill: #1e3b28; }
    .red-fill { fill: #f38ba8; }
    .mauve-fill { fill: #cba6f7; }
    .teal-fill { fill: #94e2d5; }
    .react-zone { fill: #252537; stroke: #45475a; }
    .legend-bg { fill: #313244; stroke: #45475a; }
    .legend-text { fill: #cdd6f4; }
    .label-bg { fill: rgba(49,50,68,0.9); }
    .node-label { fill: #cdd6f4; }
    .node-sublabel { fill: #a6adc8; }
    .arrow-label { fill: #a6adc8; }
    .section-title { fill: #cdd6f4; }
    .legend-label { fill: #cdd6f4; }
  }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1e66f5" stroke-width="1.5"/>
  </marker>
  <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1e66f5" stroke-width="1.5"/>
  </marker>
  <marker id="arrow-bold" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
    <path d="M 0 0 L 14 7 L 0 14" fill="#1e66f5" stroke="#1e66f5" stroke-width="2.5"/>
  </marker>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000018"/>
  </filter>
  <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00000014"/>
  </filter>

  <!-- Cylinder template -->
  <g id="node-cylinder">
    <path d="M 0 15 L 0 78 A 85 15 0 0 0 170 78 L 170 15 A 85 15 0 0 1 0 15 Z" class="node-bg" stroke="#ccd0da" stroke-width="1.5" filter="url(#shadow)"/>
    <ellipse cx="85" cy="15" rx="85" ry="15" class="node-bg" stroke="#ccd0da" stroke-width="1.5"/>
  </g>
</defs>

<!-- Page background -->
<rect width="1600" height="1100" class="diagram-bg"/>

<!-- Subtle decorative line -->
<line x1="100" y1="55" x2="1500" y2="55" stroke="#1e66f5" stroke-width="2" opacity="0.25"/>

<!-- ===== USER (left, sending query) ===== -->
<circle cx="100" cy="520" r="38" class="node-bg" stroke="#1e66f5" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="100" cy="505" r="8" class="accent-fill"/>
<line x1="100" y1="513" x2="100" y2="535" stroke="#1e66f5" stroke-width="2" stroke-linecap="round"/>
<line x1="84" y1="525" x2="116" y2="525" stroke="#1e66f5" stroke-width="2" stroke-linecap="round"/>
<text x="100" y="580" text-anchor="middle" class="node-label" font-size="13">User</text>

<!-- ===== REACT LOOP ZONE (dashed boundary box) ===== -->
<rect x="340" y="105" width="1080" height="780" rx="14" class="react-zone" stroke="#d5d0e0" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadow-lg)"/>
<rect x="360" y="93" width="100" height="26" rx="6" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
<text x="410" y="111" text-anchor="middle" class="section-title" font-size="11">ReAct Loop Zone</text>

<!-- ===== ORCHESTRATOR (hexagon, center-left) ===== -->
<g transform="translate(400,460)">
  <polygon points="40,0 200,0 240,40 200,80 40,80 0,40" class="node-bg" stroke="#1e66f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="32" text-anchor="middle" class="node-label">Orchestrator</text>
  <text x="120" y="48" text-anchor="middle" class="node-sublabel" font-size="11">Agent / Router</text>
  <text x="120" y="62" text-anchor="middle" class="node-sublabel">LangChain</text>
</g>

<!-- ===== LLM (double-border rectangle, center-top) ===== -->
<g transform="translate(640,180)">
  <!-- Outer rect -->
  <rect x="0" y="0" width="240" height="80" rx="10" class="node-bg" stroke="#1e66f5" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Inner rect (double border effect) -->
  <rect x="5" y="5" width="230" height="70" rx="7" fill="none" stroke="#1e66f5" stroke-width="1" opacity="0.4"/>
  <text x="120" y="30" text-anchor="middle" class="node-label" font-size="15" font-weight="700">LLM</text>
  <text x="120" y="48" text-anchor="middle" class="node-sublabel" font-size="11">Claude 3.5 Sonnet</text>
  <text x="120" y="63" text-anchor="middle" class="node-sublabel" font-size="10">Anthropic</text>
</g>

<!-- ===== VECTOR STORE (cylinder, top-right) ===== -->
<g transform="translate(1040,120)">
  <use href="#node-cylinder"/>
  <rect x="0" y="15" width="170" height="78" fill="#8839ef" opacity="0.06"/>
  <text x="85" y="44" text-anchor="middle" class="node-label" font-size="13">Vector Store</text>
  <text x="85" y="62" text-anchor="middle" class="node-sublabel">Pinecone</text>
</g>

<!-- ===== WEB SEARCH TOOL (rectangle, middle-right) ===== -->
<g transform="translate(1040,360)">
  <rect x="0" y="0" width="170" height="56" rx="8" class="node-bg" stroke="#179299" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="0" y="0" width="170" height="56" rx="8" fill="#179299" opacity="0.06"/>
  <text x="85" y="24" text-anchor="middle" class="node-label" font-size="13">Web Search</text>
  <text x="85" y="42" text-anchor="middle" class="node-sublabel">Tool</text>
</g>

<!-- ===== DOCUMENT STORE (cylinder, bottom-right) ===== -->
<g transform="translate(1040,600)">
  <use href="#node-cylinder"/>
  <rect x="0" y="15" width="170" height="78" fill="#40a02b" opacity="0.06"/>
  <text x="85" y="44" text-anchor="middle" class="node-label" font-size="13">Document Store</text>
  <text x="85" y="62" text-anchor="middle" class="node-sublabel">S3 Documents</text>
</g>

<!-- ===== RESPONSE USER (right side, receiving stream) ===== -->
<circle cx="1460" cy="520" r="38" class="node-bg" stroke="#40a02b" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="1460" cy="505" r="8" fill="#40a02b"/>
<line x1="1460" y1="513" x2="1460" y2="535" stroke="#40a02b" stroke-width="2" stroke-linecap="round"/>
<line x1="1444" y1="525" x2="1476" y2="525" stroke="#40a02b" stroke-width="2" stroke-linecap="round"/>
<text x="1460" y="580" text-anchor="middle" class="node-label" font-size="13">Response</text>

<!-- ===== ARROWS ===== -->

<!-- 1. User → Orchestrator (solid): "Submit query" -->
<path d="M 138 520 L 280 520 L 280 495 L 400 495" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="245" y="498" width="60" height="18" rx="3" class="label-bg"/>
<text x="275" y="511" text-anchor="middle" class="arrow-label">Query</text>

<!-- 2. Orchestrator → LLM (solid): "Context + prompt" -->
<path d="M 520 470 L 580 470 L 580 235 L 640 235" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="555" y="338" width="50" height="18" rx="3" class="label-bg"/>
<text x="580" y="351" text-anchor="middle" class="arrow-label" transform="rotate(-90,580,351)">Prompt</text>

<!-- 3. Orchestrator → Vector Store (solid): "Retrieve" -->
<path d="M 640 490 L 860 490 L 860 190 L 1040 190" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="468" width="65" height="18" rx="3" class="label-bg"/>
<text x="822" y="481" text-anchor="middle" class="arrow-label">Retrieve</text>

<!-- 4. Vector Store → LLM (dashed, ReAct feedback): "Top-k docs" -->
<path d="M 1040 158 L 900 158 L 900 220 L 880 220" class="arrow-dashed" stroke-width="2" marker-end="url(#arrow-dashed)"/>
<rect x="905" y="143" width="60" height="18" rx="3" class="label-bg"/>
<text x="935" y="156" text-anchor="middle" class="arrow-label">Context</text>

<!-- 5. LLM → Web Search (solid): "Tool call" -->
<path d="M 880 260 L 1040 383" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="920" y="310" width="55" height="18" rx="3" class="label-bg"/>
<text x="947" y="323" text-anchor="middle" class="arrow-label">Search</text>

<!-- 6. Web Search → LLM (dashed, ReAct): "Results" -->
<path d="M 1210 383 L 1210 235 L 880 235" class="arrow-dashed" stroke-width="1.8" marker-end="url(#arrow-dashed)"/>
<rect x="1140" y="320" width="42" height="18" rx="3" class="label-bg"/>
<text x="1161" y="333" text-anchor="middle" class="arrow-label" transform="rotate(-90,1161,333)">Results</text>

<!-- 7. Orchestrator → Document Store (solid): "Fetch docs" -->
<path d="M 640 510 L 860 510 L 860 640 L 1040 640" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="595" width="48" height="18" rx="3" class="label-bg"/>
<text x="814" y="608" text-anchor="middle" class="arrow-label">Fetch</text>

<!-- 8. Document Store → Orchestrator (dashed): "Source docs" -->
<path d="M 1040 660 L 860 660 L 860 530 L 640 530" class="arrow-dashed" stroke-width="1.8" marker-end="url(#arrow-dashed)"/>
<rect x="878" y="643" width="55" height="18" rx="3" class="label-bg"/>
<text x="905" y="656" text-anchor="middle" class="arrow-label">Sources</text>

<!-- 9. LLM → Orchestrator (dashed, ReAct feedback loop): "Reasoning" -->
<path d="M 640 230 L 580 230 L 580 420 L 520 420" class="arrow-dashed" stroke-width="1.8" marker-end="url(#arrow-dashed)"/>
<rect x="558" y="315" width="44" height="18" rx="3" class="label-bg"/>
<text x="580" y="328" text-anchor="middle" class="arrow-label" transform="rotate(-90,580,328)">ReAct</text>

<!-- 10. Orchestrator → Response User (BOLD): "Streaming response" -->
<path d="M 1422 520 L 1460 520" class="arrow-bold" stroke-width="3.5" marker-end="url(#arrow-bold)"/>
<rect x="1370" y="503" width="62" height="18" rx="3" class="label-bg"/>
<text x="1401" y="516" text-anchor="middle" class="arrow-label" font-weight="600">Stream</text>

<!-- ===== LEGEND ===== -->
<g transform="translate(100,900)">
  <rect x="0" y="0" width="1400" height="100" rx="8" class="legend-bg" stroke="#ccd0da" stroke-width="1" filter="url(#shadow)"/>
  <text x="20" y="22" class="section-title" font-size="13">Legend</text>

  <!-- Circle -->
  <circle cx="40" cy="48" r="10" class="node-bg" stroke="#1e66f5" stroke-width="1.5"/>
  <text x="60" y="53" class="legend-label">Person / actor</text>

  <!-- Hexagon -->
  <polygon points="180,38 210,38 220,48 210,58 180,58 170,48" class="node-bg" stroke="#1e66f5" stroke-width="1.5"/>
  <text x="228" y="53" class="legend-label">Orchestrator / agent</text>

  <!-- Double rect -->
  <rect x="380" y="40" width="40" height="18" rx="4" class="node-bg" stroke="#1e66f5" stroke-width="2"/>
  <rect x="383" y="43" width="34" height="12" rx="3" fill="none" stroke="#1e66f5" stroke-width="0.8" opacity="0.4"/>
  <text x="428" y="53" class="legend-label">LLM (AI model)</text>

  <!-- Cylinder -->
  <g transform="translate(550,33)">
    <path d="M 0 8 L 0 36 A 30 8 0 0 0 60 36 L 60 8 A 30 8 0 0 1 0 8 Z" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
    <ellipse cx="30" cy="8" rx="30" ry="8" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
  </g>
  <text x="620" y="53" class="legend-label">Data store</text>

  <!-- Rect -->
  <rect x="750" y="40" width="40" height="18" rx="4" class="node-bg" stroke="#179299" stroke-width="1.5"/>
  <text x="798" y="53" class="legend-label">External tool</text>

  <!-- Dashed boundary -->
  <rect x="930" y="40" width="40" height="18" rx="4" fill="none" stroke="#d5d0e0" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="978" y="53" class="legend-label">ReAct processing zone</text>

  <!-- Solid arrow -->
  <line x1="1130" y1="49" x2="1180" y2="49" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="53" class="legend-label">Sync / direct call</text>

  <!-- Dashed arrow -->
  <line x1="20" y1="83" x2="70" y2="83" class="arrow-dashed" stroke-width="2" marker-end="url(#arrow-dashed)"/>
  <text x="78" y="88" class="legend-label">Async / return / ReAct feedback</text>

  <!-- Bold arrow -->
  <line x1="310" y1="83" x2="370" y2="83" class="arrow-bold" stroke-width="3.5" marker-end="url(#arrow-bold)"/>
  <text x="380" y="88" class="legend-label">Streaming response</text>

  <!-- ReAct cycle label -->
  <path d="M 560 83 Q 600 75 640 83" fill="none" class="arrow-dashed" stroke-width="1.5"/>
  <text x="650" y="88" class="legend-label">ReAct (Reason + Act) loop</text>
</g>
</svg>
</div>
</body>
</html>
