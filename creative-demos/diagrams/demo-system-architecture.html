<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce Platform — System Architecture</title>
<style>
@page { size: A4 landscape; margin: 0.4in; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: #eff1f5;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.page { width: 1300px; background: #eff1f5; padding: 20px 0; }
.title { text-align: center; font-size: 28px; font-weight: 800; color: #4c4f69; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 14px; color: #6c6f85; margin-bottom: 16px; }
svg.diagram { width: 100%; height: auto; display: block; }

@media print { body { padding: 0; } .page { width: 100%; padding: 0; } }

@media (prefers-color-scheme: dark) {
  body { background: #1e1e2e; }
  .page { background: #1e1e2e; }
  .title { color: #cdd6f4; }
  .subtitle { color: #a6adc8; }
}
</style>
</head>
<body>
<div class="page">
<div class="title">E-Commerce Platform — System Architecture</div>
<div class="subtitle">Microservices deployment on AWS — component diagram</div>
<svg class="diagram" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
<style>
  .diagram-bg { fill: var(--page-bg, #eff1f5); }
  .vpc-bg { fill: var(--vpc-bg, #dce0e8); }
  .vpc-border { stroke: var(--vpc-border, #bcc0cc); fill: none; }
  .node-bg { fill: var(--node-bg, #e6e9ef); }
  .node-border { stroke: var(--border, #ccd0da); }
  .node-accent { stroke: var(--accent, #1e66f5); }
  .text-main { fill: var(--text, #4c4f69); }
  .text-secondary { fill: var(--text-sec, #6c6f85); }
  .text-inverse { fill: var(--text-inv, #eff1f5); }
  .text-accent { fill: var(--accent, #1e66f5); }
  .arrow-line { stroke: var(--accent, #1e66f5); fill: none; }
  .arrow-dashed { stroke: var(--accent, #1e66f5); fill: none; stroke-dasharray: 6,4; }
  .highlight-fill { fill: var(--yellow, #df8e1d); }
  .db-fill { fill: var(--teal-bg, #d8f0ed); }
  .db-border { stroke: var(--teal, #179299); }
  .queue-fill { fill: var(--mauve-bg, #ede0f7); }
  .queue-border { stroke: var(--mauve, #8839ef); }
  .legend-bg { fill: var(--node-bg, #e6e9ef); stroke: var(--border, #ccd0da); }
  .legend-text { fill: var(--text, #4c4f69); }
  .status-green { fill: var(--green, #40a02b); }
  .status-red { fill: var(--red, #d20f39); }
  .label-bg { fill: var(--label-bg, rgba(230,233,239,0.85)); }
  .vpc-label { fill: var(--text, #4c4f69); font-family: system-ui,sans-serif; font-size: 15px; font-weight: 700; }
  .node-label { font-family: system-ui,sans-serif; font-size: 14px; font-weight: 600; }
  .node-sublabel { font-family: system-ui,sans-serif; font-size: 11px; font-weight: 400; }
  .arrow-label { font-family: system-ui,sans-serif; font-size: 10px; font-weight: 500; }
  .legend-label { font-family: system-ui,sans-serif; font-size: 11px; }
  .section-title { font-family: system-ui,sans-serif; font-size: 12px; font-weight: 700; }
  #arrow path, #arrow-dashed path { stroke: var(--accent, #1e66f5); fill: none; }
  #arrow-bold path { fill: var(--accent, #1e66f5); stroke: var(--accent, #1e66f5); }
  @media (prefers-color-scheme: dark) {
    .diagram-bg { fill: #1e1e2e; }
    .vpc-bg { fill: #181825; }
    .vpc-border { stroke: #45475a; }
    .node-bg { fill: #313244; }
    .node-border { stroke: #45475a; }
    .text-main { fill: #cdd6f4; }
    .text-secondary { fill: #a6adc8; }
    .text-inverse { fill: #1e1e2e; }
    .text-accent { fill: #89b4fa; }
    .arrow-line { stroke: #89b4fa; }
    .arrow-dashed { stroke: #89b4fa; }
    .highlight-fill { fill: #f9e2af; }
    .db-fill { fill: #1e3b3b; }
    .db-border { stroke: #94e2d5; }
    .queue-fill { fill: #3b2b4f; }
    .queue-border { stroke: #cba6f7; }
    .legend-bg { fill: #313244; stroke: #45475a; }
    .legend-text { fill: #cdd6f4; }
    .status-green { fill: #a6e3a1; }
    .status-red { fill: #f38ba8; }
    .label-bg { fill: rgba(49,50,68,0.9); }
    .vpc-label { fill: #cdd6f4; }
    .node-label { fill: #cdd6f4; }
    .node-sublabel { fill: #a6adc8; }
    .arrow-label { fill: #a6adc8; }
    .legend-label { fill: #cdd6f4; }
    .section-title { fill: #cdd6f4; }
  }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1e66f5" stroke-width="1.5"/>
  </marker>
  <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1e66f5" stroke-width="1.5"/>
  </marker>
  <marker id="arrow-bold" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12" fill="#1e66f5" stroke="#1e66f5" stroke-width="2"/>
  </marker>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000018"/>
  </filter>
  <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000014"/>
  </filter>

  <!-- Node templates -->
  <g id="node-service">
    <rect x="0" y="0" width="200" height="56" rx="8" class="node-bg" stroke="#ccd0da" stroke-width="1.5" filter="url(#shadow)"/>
  </g>
  <g id="node-cylinder">
    <path d="M 0 15 L 0 78 A 85 15 0 0 0 170 78 L 170 15 A 85 15 0 0 1 0 15 Z" class="node-bg" stroke="#ccd0da" stroke-width="1.5" filter="url(#shadow)"/>
    <ellipse cx="85" cy="15" rx="85" ry="15" class="node-bg" stroke="#ccd0da" stroke-width="1.5"/>
  </g>
</defs>

<!-- Page background -->
<rect width="1600" height="1100" class="diagram-bg"/>

<!-- Title area line -->
<line x1="200" y1="50" x2="1400" y2="50" stroke="#1e66f5" stroke-width="2" opacity="0.3"/>

<!-- ===== AWS VPC Boundary ===== -->
<rect x="220" y="80" width="1200" height="920" rx="16" class="vpc-bg vpc-border" stroke="#bcc0cc" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow-lg)"/>
<rect x="240" y="68" width="140" height="28" rx="6" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
<text x="310" y="86" text-anchor="middle" class="vpc-label" font-size="12" font-weight="600">AWS VPC</text>

<!-- ===== External User ===== -->
<circle cx="100" cy="520" r="38" class="node-bg" stroke="#1e66f5" stroke-width="2.5" filter="url(#shadow)"/>
<!-- Simplified figure inside -->
<circle cx="100" cy="507" r="8" class="text-accent" fill="#1e66f5"/>
<line x1="100" y1="515" x2="100" y2="535" stroke="#1e66f5" stroke-width="2" stroke-linecap="round"/>
<line x1="84" y1="525" x2="116" y2="525" stroke="#1e66f5" stroke-width="2" stroke-linecap="round"/>
<text x="100" y="580" text-anchor="middle" class="node-label" font-size="13">User /</text>
<text x="100" y="596" text-anchor="middle" class="node-label" font-size="13">Customer</text>

<!-- ===== ROW 1 — Network & Application ===== -->

<!-- Load Balancer -->
<g transform="translate(360,160)">
  <use href="#node-service"/>
  <rect x="0" y="0" width="200" height="56" rx="8" fill="#1e66f5" opacity="0.08"/>
  <text x="100" y="24" text-anchor="middle" class="node-label">Load Balancer</text>
  <text x="100" y="42" text-anchor="middle" class="node-sublabel">NLB / ALB</text>
</g>

<!-- App Server -->
<g transform="translate(700,160)">
  <use href="#node-service"/>
  <rect x="0" y="0" width="200" height="56" rx="8" fill="#1e66f5" opacity="0.08"/>
  <text x="100" y="24" text-anchor="middle" class="node-label">App Server</text>
  <text x="100" y="42" text-anchor="middle" class="node-sublabel">Node.js / Express</text>
</g>

<!-- Redis Cache (cylinder) -->
<g transform="translate(1060,135)">
  <use href="#node-cylinder"/>
  <rect x="0" y="15" width="170" height="78" fill="#1e66f5" opacity="0.05"/>
  <text x="85" y="50" text-anchor="middle" class="node-label">Cache</text>
  <text x="85" y="68" text-anchor="middle" class="node-sublabel">Redis</text>
</g>

<!-- ===== ROW 2 — Data ===== -->

<!-- PostgreSQL (cylinder) -->
<g transform="translate(700,310)">
  <use href="#node-cylinder"/>
  <rect x="0" y="15" width="170" height="78" fill="#40a02b" opacity="0.06"/>
  <text x="85" y="50" text-anchor="middle" class="node-label">Database</text>
  <text x="85" y="68" text-anchor="middle" class="node-sublabel">PostgreSQL</text>
</g>

<!-- ===== ROW 3 — Async Messaging ===== -->

<!-- RabbitMQ (pill) -->
<g transform="translate(360,480)">
  <rect x="0" y="0" width="200" height="56" rx="28" class="queue-fill queue-border" stroke="#8839ef" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="24" text-anchor="middle" class="node-label">Message Queue</text>
  <text x="100" y="42" text-anchor="middle" class="node-sublabel">RabbitMQ</text>
</g>

<!-- Background Workers -->
<g transform="translate(700,480)">
  <use href="#node-service"/>
  <rect x="0" y="0" width="200" height="56" rx="8" fill="#8839ef" opacity="0.06"/>
  <text x="100" y="24" text-anchor="middle" class="node-label">Background Workers</text>
  <text x="100" y="42" text-anchor="middle" class="node-sublabel">Node.js Workers</text>
</g>

<!-- ===== ROW 4 — Observability ===== -->

<!-- Monitoring / Logging -->
<g transform="translate(1060,680)">
  <use href="#node-service"/>
  <rect x="0" y="0" width="200" height="56" rx="8" fill="#179299" opacity="0.06"/>
  <text x="100" y="24" text-anchor="middle" class="node-label">Monitoring &amp; Logging</text>
  <text x="100" y="42" text-anchor="middle" class="node-sublabel">CloudWatch / Grafana</text>
</g>

<!-- ===== ARROWS ===== -->

<!-- 1. User → Load Balancer -->
<path d="M 138 520 L 280 520 L 280 188 L 360 188" class="arrow-line" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230" y="505" width="80" height="18" rx="3" class="label-bg"/>
<text x="270" y="518" text-anchor="middle" class="arrow-label">HTTPS</text>

<!-- 2. Load Balancer → App Server -->
<line x1="560" y1="188" x2="700" y2="188" class="arrow-line" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="583" y="171" width="95" height="18" rx="3" class="label-bg"/>
<text x="630" y="184" text-anchor="middle" class="arrow-label">Route traffic</text>

<!-- 3. App Server → Cache -->
<line x1="900" y1="188" x2="1060" y2="188" class="arrow-line" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="938" y="171" width="85" height="18" rx="3" class="label-bg"/>
<text x="980" y="184" text-anchor="middle" class="arrow-label">Cache R/W</text>

<!-- 4. App Server → Database -->
<path d="M 800 216 L 800 310" class="arrow-line" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="782" y="248" width="36" height="18" rx="3" class="label-bg"/>
<text x="800" y="261" text-anchor="middle" class="arrow-label" transform="rotate(-90,800,261)">Persist</text>

<!-- 5. Load Balancer → Message Queue (async) -->
<path d="M 460 216 L 460 480" class="arrow-dashed" stroke-width="1.8" marker-end="url(#arrow-dashed)"/>
<rect x="442" y="335" width="36" height="18" rx="3" class="label-bg"/>
<text x="460" y="348" text-anchor="middle" class="arrow-label" transform="rotate(-90,460,348)">Emit</text>

<!-- 6. Message Queue → Workers -->
<line x1="560" y1="508" x2="700" y2="508" class="arrow-line" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="583" y="491" width="95" height="18" rx="3" class="label-bg"/>
<text x="630" y="504" text-anchor="middle" class="arrow-label">Consume</text>

<!-- 7. Workers → Monitoring (dashed) -->
<path d="M 800 536 L 800 620 L 1060 620 L 1060 680" class="arrow-dashed" stroke-width="1.5" marker-end="url(#arrow-dashed)"/>
<rect x="882" y="603" width="75" height="18" rx="3" class="label-bg"/>
<text x="920" y="616" text-anchor="middle" class="arrow-label">Export logs</text>

<!-- 8. App Server → Monitoring (dashed) -->
<path d="M 850 216 L 850 240 L 1160 240 L 1160 680" class="arrow-dashed" stroke-width="1.5" marker-end="url(#arrow-dashed)"/>
<rect x="1060" y="250" width="80" height="18" rx="3" class="label-bg"/>
<text x="1100" y="263" text-anchor="middle" class="arrow-label">App metrics</text>

<!-- Replication indicator on DB -->
<path d="M 700 372 Q 650 380 700 388" fill="none" class="arrow-line" stroke-width="1.2"/>
<text x="650" y="395" text-anchor="middle" class="arrow-label" font-size="9">standby</text>

<!-- ===== LEGEND ===== -->
<g transform="translate(120,880)">
  <rect x="0" y="0" width="1360" height="100" rx="8" class="legend-bg" stroke="#ccd0da" stroke-width="1" filter="url(#shadow)"/>
  <text x="20" y="22" class="section-title" font-size="13">Legend</text>

  <!-- Services -->
  <rect x="20" y="36" width="60" height="22" rx="4" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
  <text x="90" y="52" class="legend-label">Service (stateless)</text>

  <!-- Cylinder -->
  <g transform="translate(280,30)">
    <path d="M 0 8 L 0 36 A 30 8 0 0 0 60 36 L 60 8 A 30 8 0 0 1 0 8 Z" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
    <ellipse cx="30" cy="8" rx="30" ry="8" class="node-bg" stroke="#ccd0da" stroke-width="1"/>
  </g>
  <text x="355" y="52" class="legend-label">Data store (cache / database)</text>

  <!-- Pill -->
  <rect x="550" y="36" width="60" height="22" rx="11" class="queue-fill queue-border" stroke="#8839ef" stroke-width="1"/>
  <text x="620" y="52" class="legend-label">Message queue</text>

  <!-- Boundary -->
  <rect x="800" y="36" width="60" height="22" rx="4" fill="none" stroke="#bcc0cc" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="870" y="52" class="legend-label">Network boundary</text>

  <!-- Solid arrow -->
  <line x1="1020" y1="47" x2="1080" y2="47" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="52" class="legend-label">Sync call</text>

  <!-- Dashed arrow -->
  <line x1="20" y1="78" x2="80" y2="78" class="arrow-dashed" stroke-width="2" marker-end="url(#arrow-dashed)"/>
  <text x="90" y="83" class="legend-label">Async / data flow</text>

  <!-- Monitoring icon -->
  <circle cx="285" cy="78" r="8" fill="#179299" opacity="0.3" stroke="#179299" stroke-width="1"/>
  <polygon points="285,72 282,84 288,84" fill="#179299"/>
  <text x="305" y="83" class="legend-label">Observability</text>

  <!-- User circle -->
  <circle cx="510" cy="78" r="8" class="node-bg" stroke="#1e66f5" stroke-width="1.5"/>
  <text x="528" y="83" class="legend-label">External actor</text>

  <!-- Status dots -->
  <circle cx="710" cy="78" r="5" class="status-green"/>
  <text x="725" y="83" class="legend-label">Healthy / active</text>
  <circle cx="860" cy="78" r="5" class="status-red"/>
  <text x="875" y="83" class="legend-label">Degraded / inactive</text>
</g>
</svg>
</div>
</body>
</html>
