<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Incident Response Decision Tree</title>
<style>
@page { size: A4 landscape; margin: 0.4in; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #fff; display: flex; justify-content: center; padding: 20px; }
.page { width: 1100px; background: #fff; padding: 20px 0; }
.title { text-align: center; font-size: 28px; font-weight: 800; color: #111; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 14px; color: #555; margin-bottom: 12px; }
svg.diagram { width: 100%; height: auto; display: block; }
@media print { body { padding: 0; } .page { width: 100%; padding: 0; } }
</style>
</head>
<body>
<div class="page">
<div class="title">Production Incident Response</div>
<div class="subtitle">Decision tree — SRE on-call triage guide</div>
<svg class="diagram" viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#5a78ff" stroke-width="1.5"/>
</marker>
<filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
</filter>
</defs>
<rect width="1400" height="750" fill="#fff"/>

<!-- Root -->
<rect x="550" y="20" width="300" height="44" rx="8" fill="#f3df58" stroke="#b29a10" stroke-width="2" filter="url(#shadow)"/>
<text x="700" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#111">Alert Fires 🔔</text>

<!-- Level 1 -->
<line x1="700" y1="64" x2="700" y2="90" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="95" width="400" height="44" rx="20" fill="#f8e39c" stroke="#9a7b24" stroke-width="1.5" filter="url(#shadow)"/>
<text x="700" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#111">Is a user-facing service affected?</text>

<!-- Level 2 branches -->
<line x1="600" y1="139" x2="350" y2="175" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="800" y1="139" x2="1050" y2="175" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#e53935">Yes</text>
<text x="960" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#43a047">No</text>

<rect x="170" y="180" width="360" height="44" rx="6" fill="#f3df58" stroke="#b29a10" stroke-width="1.5" filter="url(#shadow)"/>
<text x="350" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#111">P0 — Critical Incident</text>
<rect x="880" y="180" width="340" height="44" rx="6" fill="#f3df58" stroke="#b29a10" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1050" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#111">P1 — Non-Critical Bug</text>

<!-- Level 3 -->
<line x1="350" y1="224" x2="250" y2="260" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="224" x2="450" y2="260" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="224" x2="950" y2="260" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="224" x2="1150" y2="260" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="70" y="265" width="340" height="40" rx="6" fill="#f8e39c" stroke="#9a7b24" stroke-width="1" filter="url(#shadow)"/>
<text x="240" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#111">Has direct fix?</text>
<rect x="290" y="265" width="340" height="40" rx="6" fill="#f8e39c" stroke="#9a7b24" stroke-width="1" filter="url(#shadow)"/>
<text x="460" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#111">Rollback possible?</text>
<rect x="770" y="265" width="340" height="40" rx="6" fill="#f8e39c" stroke="#9a7b24" stroke-width="1" filter="url(#shadow)"/>
<text x="940" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#111">Business impact?</text>
<rect x="990" y="265" width="340" height="40" rx="6" fill="#f8e39c" stroke="#9a7b24" stroke-width="1" filter="url(#shadow)"/>
<text x="1160" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#111">Can reproduce?</text>

<!-- Level 4 - Actions -->
<line x1="240" y1="305" x2="200" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240" y1="305" x2="320" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="305" x2="400" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="305" x2="520" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="940" y1="305" x2="900" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="940" y1="305" x2="1000" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1160" y1="305" x2="1100" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1160" y1="305" x2="1220" y2="350" stroke="#5a78ff" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="355" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" filter="url(#shadow)"/>
<text x="170" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2e7d32">Hotfix → Deploy</text>
<rect x="200" y="355" width="240" height="36" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" filter="url(#shadow)"/>
<text x="320" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e65100">Feature flag off</text>
<rect x="280" y="355" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" filter="url(#shadow)"/>
<text x="400" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2e7d32">Rollback → Verify</text>
<rect x="400" y="355" width="240" height="36" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" filter="url(#shadow)"/>
<text x="520" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e65100">Mitigate + Escalate</text>
<rect x="780" y="355" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" filter="url(#shadow)"/>
<text x="900" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2e7d32">Log bug → Fix next sprint</text>
<rect x="890" y="355" width="240" height="36" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" filter="url(#shadow)"/>
<text x="1010" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e65100">Schedule fix</text>
<rect x="990" y="355" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" filter="url(#shadow)"/>
<text x="1110" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2e7d32">Write test → Fix</text>
<rect x="1100" y="355" width="240" height="36" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="1" filter="url(#shadow)"/>
<text x="1220" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#fff">Gather more data</text>

<!-- Post-mortem footer -->
<rect x="400" y="460" width="600" height="44" rx="8" fill="#f3df58" stroke="#b29a10" stroke-width="1.5" filter="url(#shadow)"/>
<text x="700" y="488" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#111">All Paths → Root Cause Analysis &amp; Post-Mortem (within 48h)</text>

<line x1="350" y1="391" x2="550" y2="460" stroke="#5a78ff" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="1050" y1="391" x2="850" y2="460" stroke="#5a78ff" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Legend -->
<rect x="50" y="580" width="14" height="14" rx="3" fill="#f3df58" stroke="#b29a10" stroke-width="1"/>
<text x="70" y="592" font-family="system-ui,sans-serif" font-size="11" fill="#555">Decision / group header</text>
<rect x="240" y="580" width="14" height="14" rx="3" fill="#f8e39c" stroke="#9a7b24" stroke-width="1"/>
<text x="260" y="592" font-family="system-ui,sans-serif" font-size="11" fill="#555">Conditional branch</text>
<rect x="430" y="580" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
<text x="450" y="592" font-family="system-ui,sans-serif" font-size="11" fill="#555">Resolution action</text>
<rect x="600" y="580" width="14" height="14" rx="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1"/>
<text x="620" y="592" font-family="system-ui,sans-serif" font-size="11" fill="#555">Mitigation action</text>
</svg>
</div>
</body>
</html>
