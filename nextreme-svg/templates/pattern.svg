<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" width="400" height="400" role="img" aria-hidden="true">
  <title>Tileable Pattern</title>
  <desc>Diagonal dots, patternUnits userSpaceOnUse, transformable</desc>
  <defs>
    <pattern id="nxt-dots" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <circle cx="10" cy="10" r="1.2" fill="#1B4F72" opacity="0.14"/>
    </pattern>
    <linearGradient id="nxt-pat-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1B4F72"/><stop offset="100%" stop-color="#A8DADC"/></linearGradient>
  </defs>
  <g id="background"><rect width="400" height="400" fill="url(#nxt-dots)"/><rect width="400" height="400" fill="none" stroke="#e4e4e7"/></g>
  <g id="nodes"><rect x="40" y="40" width="320" height="320" rx="16" fill="none" stroke="url(#nxt-pat-grad)" stroke-width="1.2"/></g>
  <g id="labels"><text x="200" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#52525b">patternTransform rotate(35)</text></g>
  <g id="connections"/>
</svg>
