<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" width="1200" height="500" role="img">
  <title>Bar Chart — Q1–Q4 Revenue</title>
  <desc>Native vector bars, tabular-nums, 6-stop hue-shift accent, no raster</desc>
  <defs>
    <linearGradient id="nxt-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E86AB"/><stop offset="100%" stop-color="#1B4F72"/></linearGradient>
  </defs>
  <g id="background"><rect width="1200" height="500" fill="white"/></g>
  <g id="nodes">
    <!-- Axes -->
    <line x1="80" y1="400" x2="1120" y2="400" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="400" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Bars — 4 stops hue-shift -->
    <rect x="160" y="300" width="140" height="100" rx="6" fill="url(#nxt-bar)"/>
    <rect x="380" y="240" width="140" height="160" rx="6" fill="url(#nxt-bar)"/>
    <rect x="600" y="180" width="140" height="220" rx="6" fill="url(#nxt-bar)"/>
    <rect x="820" y="140" width="140" height="260" rx="6" fill="url(#nxt-bar)"/>
    <rect x="1020" y="120" width="40" height="280" rx="6" fill="#A8DADC" opacity="0.9"/>
  </g>
  <g id="labels">
    <text x="230" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#52525b" font-variant-numeric="tabular-nums">Q1</text>
    <text x="450" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#52525b" font-variant-numeric="tabular-nums">Q2</text>
    <text x="670" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#52525b" font-variant-numeric="tabular-nums">Q3</text>
    <text x="890" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#52525b" font-variant-numeric="tabular-nums">Q4</text>
    <text x="40" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#71717a" transform="rotate(-90 40 405)">Revenue</text>
    <text x="600" y="30" text-anchor="middle" font-family="Newsreader, serif" font-size="13" fill="#1a1a1e" font-weight="600">Q1–Q4 · tabular-nums · vector</text>
  </g>
  <g id="connections"/>
</svg>
